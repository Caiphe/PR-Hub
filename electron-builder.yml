appId: com.prhub.app
productName: PR Hub
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Development-only: test fixtures, build scripts, plans, icon sources, tooling state.
  - '!{fixtures,scripts,coverage,.gstack}/**'
  - '!{PLAN.md,PROMPTS.md,vitest.config.ts}'
  - '!resources/icons/**'
asarUnpack:
  - resources/**
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
  # Ad-hoc signature: enough for Apple Silicon to run a local build. For distribution,
  # set a Developer ID identity here and enable notarize.
  identity: '-'
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
win:
  executableName: pr-hub
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
linux:
  target:
    - AppImage
  maintainer: caipheilunga@gmail.com
  category: Development
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
